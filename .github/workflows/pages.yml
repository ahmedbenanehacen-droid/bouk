name: Site BOUK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstituer le jeu
        run: |
          mkdir -p /tmp/site
          cat game/part1.b64 game/part2.b64 game/part3.b64 game/part4.b64 | base64 -d | xz -d > /tmp/site/index.html
          cat game/patch1a.b64 game/patch1b.b64 | base64 -d | xz -d > /tmp/d1.diff
          patch -s /tmp/site/index.html < /tmp/d1.diff
          cat game/patch2a.b64 game/patch2b.b64 | base64 -d | xz -d > /tmp/d2.diff
          patch -s /tmp/site/index.html < /tmp/d2.diff
          echo "a8fdf2eb202b34ecde70695ecaa1f899db01d9da054e36ae7f2515f0ae436396  /tmp/site/index.html" | sha256sum -c -
          ls -l /tmp/site/index.html

      - name: Publier sur gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan pages-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 -not -name .git -exec rm -rf {} +
          cp /tmp/site/index.html index.html
          cp /tmp/site/index.html 404.html
          touch .nojekyll
          git add -A
          git commit -q -m "Site BOUK"
          git push -f origin pages-tmp:gh-pages
          echo "site publie sur gh-pages"
